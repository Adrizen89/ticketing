# Filtre Fail2ban pour OpenVPN — issue #31
# Déposé dans /etc/fail2ban/filter.d/openvpn-lab.conf
#
# Détecte les échecs d'authentification, qu'ils viennent du certificat ou,
# surtout, du second facteur TOTP (issue #17).

[Definition]
failregex = ^.*<HOST>:\d+ TLS Auth Error.*$
            ^.*<HOST>:\d+ VERIFY ERROR.*$
            ^.*<HOST>:\d+ TLS Error: TLS handshake failed.*$
            ^.*PLUGIN_CALL: POST .*/openvpn-plugin-auth-pam\.so.*status=1.*$
            ^.*<HOST>:\d+ AUTH_FAILED.*$
            ^.*user '.*' failed to authenticate.*<HOST>.*$

ignoreregex =

[Init]
maxlines = 3
