# Filtre Fail2ban pour la connexion GLPI — issue #31
# Déposé dans /etc/fail2ban/filter.d/glpi-login.conf
#
# GLPI trace les échecs d'authentification dans son journal PHP. Le second motif
# rattrape les rafales de POST sur le formulaire de connexion, visibles dans le
# journal d'accès Apache même quand GLPI ne journalise pas.

[Definition]
failregex = ^.*Login failed for.*from IP <HOST>.*$
            ^.*\[<HOST>\].*Authentication failed.*$
            ^<HOST> .* "POST /front/login\.php HTTP/[\d.]+" 200 .*$

ignoreregex = ^<HOST> .* "POST /front/login\.php HTTP/[\d.]+" 302 .*$

[Init]
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
              ^[^\[]*\[%%d/%%b/%%Y:%%H:%%M:%%S
