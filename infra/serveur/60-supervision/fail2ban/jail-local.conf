# =============================================================================
# Fail2ban — issue #31
# Déposé dans /etc/fail2ban/jail.d/glpi-lab.local
# -----------------------------------------------------------------------------
# CDC §3.1 : « protection contre les attaques par force brute (limitation des
# tentatives, verrouillage temporaire) ». Trois surfaces sont concernées :
# SSH, le service VPN et le formulaire de connexion de GLPI.
# =============================================================================

[DEFAULT]
# Action via nftables, cohérente avec le pare-feu de l'issue #18.
banaction = nftables-multiport
banaction_allports = nftables-allports
backend = systemd

# Bannissement progressif : une erreur de saisie ne coûte que 10 minutes,
# l'acharnement coûte de plus en plus cher.
bantime = 10m
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 48h
findtime = 10m
maxretry = 5

# Liste blanche : la boucle locale et le réseau du tunnel pour l'administration.
# Volontairement restreinte — une liste blanche trop large annule la protection.
ignoreip = 127.0.0.1/8 ::1

destemail = root@localhost
sender = fail2ban@localhost
action = %(action_)s

[sshd]
enabled = true
port = @SSH_PORT@
maxretry = 3
findtime = 5m
bantime = 1h

[openvpn]
enabled = true
port = @VPN_PORT@
protocol = udp
filter = openvpn-lab
logpath = /var/log/openvpn/openvpn.log
maxretry = 4
findtime = 10m
bantime = 2h

[glpi-login]
enabled = true
port = http,https
filter = glpi-login
logpath = /var/log/glpi/php-errors.log
          /var/log/apache2/glpi-access.log
maxretry = 5
findtime = 10m
bantime = 30m

[apache-badbots]
enabled = true
port = http,https
logpath = /var/log/apache2/glpi-access.log
maxretry = 2
