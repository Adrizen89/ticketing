# Règles d'alerte — issue #30
# Déposé dans /etc/prometheus/rules/glpi-lab.yml
#
# Deux familles : la disponibilité du service, et les signaux de sécurité.
# Les seuils sont volontairement peu bavards : une alerte qui se déclenche en
# fonctionnement normal finit par ne plus être lue.

groups:
  - name: disponibilite
    rules:
      - alert: GlpiIndisponible
        expr: probe_success{job="glpi-disponibilite"} == 0
        for: 2m
        labels: { severite: critique }
        annotations:
          summary: "GLPI ne répond plus"
          description: "La sonde HTTPS échoue depuis 2 minutes. Vérifier apache2, mariadb et le tunnel."

      - alert: TunnelVpnTombe
        expr: node_network_up{device="tun0"} == 0 or absent(node_network_up{device="tun0"})
        for: 3m
        labels: { severite: critique }
        annotations:
          summary: "Le tunnel VPN est tombé"
          description: "tun0 est absent ou inactif. Plus aucun accès à GLPI n'est possible."

      - alert: ServiceCritiqueArrete
        expr: node_systemd_unit_state{name=~"apache2.service|mariadb.service|openvpn-server@server.service|suricata.service",state="active"} == 0
        for: 2m
        labels: { severite: critique }
        annotations:
          summary: "Service critique arrêté : {{ $labels.name }}"

  - name: ressources
    rules:
      - alert: DisqueSature
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 10m
        labels: { severite: avertissement }
        annotations:
          summary: "Espace disque faible ({{ $value | humanize }} %)"
          description: "Vérifier /var/log/suricata et les sauvegardes."

      - alert: MemoireSaturee
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 10m
        labels: { severite: avertissement }
        annotations:
          summary: "Mémoire disponible sous 10 %"

  - name: securite
    rules:
      # Le compteur vient du collecteur de journaux : rafale d'échecs
      # d'authentification, tous services confondus.
      - alert: RafaleEchecsAuthentification
        expr: increase(lab_auth_failures_total[5m]) > 20
        for: 0m
        labels: { severite: critique }
        annotations:
          summary: "Rafale d'échecs d'authentification"
          description: "{{ $value }} échecs en 5 minutes. Vérifier fail2ban-client status."

      - alert: AlerteSuricataSeveriteHaute
        expr: increase(lab_suricata_alerts_total{severity="1"}[5m]) > 0
        for: 0m
        labels: { severite: critique }
        annotations:
          summary: "Alerte Suricata de sévérité haute"
          description: "Consulter /var/log/suricata/eve.json."

      - alert: SuricataArrete
        expr: node_systemd_unit_state{name="suricata.service",state="active"} == 0
        for: 1m
        labels: { severite: critique }
        annotations:
          summary: "Suricata est arrêté — l'IPS ne protège plus"
          description: "La règle nftables porte « bypass » : le trafic passe sans inspection."
