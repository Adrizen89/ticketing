# =============================================================================
# Serveur OpenVPN — issues #15 et #17
# -----------------------------------------------------------------------------
# Pourquoi OpenVPN et non WireGuard :
#   - le schéma d'architecture impose un tunnel AES-256 ; WireGuard n'implémente
#     que ChaCha20-Poly1305 et ne permet pas de choisir l'algorithme ;
#   - le cahier de recettes impose une double authentification ; WireGuard n'a
#     aucun mécanisme d'authentification utilisateur, donc aucun second facteur
#     possible sans composant tiers.
# OpenVPN satisfait les deux exigences simultanément. Ce raisonnement est à
# reprendre dans la documentation technique (issue #36).
# =============================================================================

port @VPN_PORT@
proto @VPN_PROTO@
dev tun

# --- Matériel cryptographique ------------------------------------------------
ca            /etc/openvpn/server/pki/ca.crt
cert          /etc/openvpn/server/pki/issued/server.crt
key           /etc/openvpn/server/pki/private/server.key
dh            none
tls-crypt     /etc/openvpn/server/pki/tls-crypt.key

# --- Chiffrement — exigence AES-256 du schéma d'architecture -----------------
# Canal de données : AES-256-GCM, chiffrement authentifié.
data-ciphers            AES-256-GCM
data-ciphers-fallback   AES-256-GCM
# Canal de contrôle : TLS 1.2 minimum, courbes et suites modernes.
tls-version-min 1.2
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384
auth SHA512
ecdh-curve secp384r1
# Le serveur vérifie que le certificat client porte bien l'usage « client » :
# un certificat serveur volé ne permet pas de se connecter comme client.
remote-cert-tls client

# --- Second facteur — issue #17 ---------------------------------------------
# Authentification en deux temps :
#   1. certificat client (ce que l'on possède, au niveau machine)
#   2. identifiant + code à usage unique validé par PAM (ce que l'on possède,
#      au niveau personne)
# Un certificat volé sans le code TOTP ne suffit donc pas à monter le tunnel.
plugin /usr/lib/openvpn/openvpn-plugin-auth-pam.so openvpn
verify-client-cert require
username-as-common-name
# Pas de mise en cache des identifiants côté client : le code est redemandé
# à chaque connexion, c'est le principe même du second facteur.
auth-gen-token 0
reneg-sec 0

# --- Réseau du tunnel --------------------------------------------------------
server @VPN_SUBNET@ @VPN_MASK@
topology subnet
ifconfig-pool-persist /var/log/openvpn/ipp.txt

# Aucune redirection de passerelle : le tunnel sert à joindre GLPI, pas à
# router tout le trafic du poste. Seule la route vers le serveur est poussée.
push "route @VPN_SUBNET@ @VPN_MASK@"

# Les clients ne se voient pas entre eux. Un poste compromis ne peut pas
# atteindre les autres postes du tunnel.
# (client-to-client volontairement absent)

keepalive 10 60
persist-key
persist-tun

# --- Moindre privilège — CDC §3.2 -------------------------------------------
user nobody
group nogroup

# --- Journalisation — CDC §3.4 ----------------------------------------------
status /var/log/openvpn/status.log 10
log-append /var/log/openvpn/openvpn.log
verb 3
mute 20
