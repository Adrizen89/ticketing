# Durcissement SSH — issues #4 et #19
# Déposé dans /etc/ssh/sshd_config.d/99-hardening.conf
#
# CDC §3.1 : authentification robuste. CDC §3.2 : moindre privilège.
# L'écoute est restreinte à l'interface du tunnel : hors VPN, SSH ne répond pas.
# Le pare-feu applique la même règle — défense en profondeur, les deux couches
# doivent être cohérentes.

# Écoute sur le tunnel uniquement. Substitué à l'installation.
ListenAddress @VPN_SRV_IP@

Protocol 2
Port @SSH_PORT@

# --- Authentification --------------------------------------------------------
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
MaxSessions 4
MaxStartups 3:50:10
LoginGraceTime 30

# Liste explicite des comptes autorisés. Substituée à l'installation.
AllowUsers @SSH_ALLOW_USERS@

# --- Cryptographie -----------------------------------------------------------
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512

# --- Réduction de surface ----------------------------------------------------
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
AllowStreamLocalForwarding no

# --- Sessions ----------------------------------------------------------------
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no

# --- Journalisation ----------------------------------------------------------
# VERBOSE trace les empreintes de clé utilisées : indispensable à Fail2ban
# et à la reconstitution d'un incident (CDC §3.4).
LogLevel VERBOSE
SyslogFacility AUTH
PrintLastLog yes
Banner /etc/issue.net
