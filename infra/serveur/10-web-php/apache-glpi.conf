# =============================================================================
# Hôte virtuel GLPI — issues #10 et #11
# -----------------------------------------------------------------------------
# Racine web pointée sur public/ : config/, files/ et marketplace/ ne sont pas
# servis, même si le serveur web est mal configuré ailleurs (issue #10).
# TLS obligatoire, redirection systématique depuis HTTP (issue #11, CDC §3.3).
# =============================================================================

<VirtualHost *:80>
    ServerName @GLPI_FQDN@
    # Aucun contenu servi en clair : redirection permanente et rien d'autre.
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog  ${APACHE_LOG_DIR}/glpi-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/glpi-redirect-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName @GLPI_FQDN@
    DocumentRoot @GLPI_CODE_DIR@/public

    SSLEngine on
    SSLCertificateFile      @TLS_CERT@
    SSLCertificateKeyFile   @TLS_KEY@

    # TLS 1.2 minimum, suites modernes uniquement — critère d'acceptation #11.
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # --- En-têtes de sécurité — CDC §3.3 -------------------------------------
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # GLPI utilise des styles et scripts en ligne : une CSP trop stricte casse
    # l'interface. Politique resserrée au maximum de ce que l'application tolère.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

    # Ne pas divulguer la technologie ni sa version — CDC §3.4.
    Header always unset X-Powered-By
    Header always unset Server
    ServerSignature Off

    <Directory @GLPI_CODE_DIR@/public>
        Require all granted
        AllowOverride None
        Options -Indexes -ExecCGI -Includes +FollowSymLinks

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%1]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # Ceinture et bretelles : même si la racine était mal pointée, ces
    # répertoires resteraient inaccessibles.
    <DirectoryMatch "@GLPI_CODE_DIR@/(config|files|install|scripts|src|vendor|tests)">
        Require all denied
    </DirectoryMatch>

    # Interdiction absolue d'exécuter du PHP dans les fichiers déposés.
    <Directory @GLPI_VAR_DIR@>
        Require all denied
        php_admin_flag engine off
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/glpi-error.log
    CustomLog ${APACHE_LOG_DIR}/glpi-access.log combined
    LogLevel warn
</VirtualHost>
