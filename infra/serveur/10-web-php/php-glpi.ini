; =============================================================================
; Réglages PHP pour GLPI — issue #7
; Déposé dans /etc/php/<version>/apache2/conf.d/99-glpi.ini
; =============================================================================

; --- Prérequis GLPI ----------------------------------------------------------
memory_limit = 256M
max_execution_time = 600
max_input_vars = 5000
upload_max_filesize = 20M
post_max_size = 22M
session.auto_start = Off
session.use_strict_mode = On

; --- Sécurité des sessions — CDC §3.1 ----------------------------------------
; Cookies inaccessibles au JavaScript, transmis en HTTPS uniquement, non envoyés
; en contexte tiers : c'est la protection de base contre le vol de session et
; une partie de la protection CSRF.
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = "Lax"
session.use_only_cookies = On
session.gc_maxlifetime = 3600

; --- Réduction de surface — CDC §3.4 -----------------------------------------
; Ne pas annoncer PHP dans les en-têtes de réponse.
expose_php = Off
; Aucune erreur affichée à l'utilisateur : le détail reste dans le journal
; serveur, l'utilisateur reçoit un message générique.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Fonctions dangereuses désactivées : GLPI n'en a pas besoin, elles ne servent
; qu'à un attaquant ayant obtenu une exécution de code.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

; Pas d'inclusion de fichier distant.
allow_url_fopen = Off
allow_url_include = Off
