# =============================================================================
# Agent GLPI — issue #20
# Déposé dans /etc/glpi-agent/conf.d/99-lab.cfg
# -----------------------------------------------------------------------------
# Cahier de recettes : « À partir de la version 10, inventaire intégré
# (pas de fusion inventory). » L'agent parle directement au serveur GLPI,
# aucun greffon FusionInventory n'est installé.
#
# L'URL passe par le nom de service, qui résout vers l'adresse du tunnel :
# l'inventaire emprunte donc le VPN, comme tout le reste du trafic applicatif.
# =============================================================================

server = https://@GLPI_FQDN@/front/inventory.php

# Vérification du certificat serveur ACTIVE. Ne jamais passer à 0 :
# désactiver le contrôle rendrait le tunnel inutile face à un intercepteur.
no-ssl-check = 0
ca-cert-file = /usr/local/share/ca-certificates/glpi-lab.crt

# Identifiant stable de l'agent : évite les doublons dans le parc à chaque
# remontée (critère de l'issue #21).
tag = lab-client

# --- Planification — issue #22 -----------------------------------------------
# Une remontée par heure, avec une dispersion aléatoire pour éviter que tous
# les agents ne frappent le serveur en même temps.
delaytime = 3600
lazy = 0

# --- Périmètre collecté ------------------------------------------------------
# Inventaire local uniquement. Le poste client ne balaye pas le réseau :
# ce serait contraire à la matrice des flux et déclencherait Suricata.
tasks = inventory
no-task = deploy,esx,collect,wakeonlan,netdiscovery,netinventory

# Pas de service HTTP local sur l'agent : surface d'attaque inutile.
no-httpd = 1

# --- Journalisation ----------------------------------------------------------
logger = file
logfile = /var/log/glpi-agent/glpi-agent.log
logfile-maxsize = 10
debug = 0
